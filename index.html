<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二选一默契问答</title><style>
:root{--bg:#f7f3ec;--ink:#28231e;--muted:#7e766c;--card:#fffdf9;--line:#e8dfd3;--red:#e7664d;--gold:#e4a92f;--green:#387861}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}main{max-width:880px;margin:auto;padding:34px 18px 70px}.eyebrow{letter-spacing:.16em;font-size:12px;font-weight:800;color:var(--red)}h1{font-family:Georgia,serif;font-size:clamp(42px,8vw,76px);line-height:.95;letter-spacing:-.05em;margin:18px 0 12px}h1 em{font-style:normal;color:var(--red)}p{line-height:1.65}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:25px;margin-top:24px;box-shadow:0 15px 35px #5b493018}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:12px 0}.label{font-size:12px;letter-spacing:.1em;font-weight:800;color:var(--muted);display:block;margin-bottom:7px}input,select,button{font:inherit;border-radius:13px;padding:13px 14px;border:1px solid var(--line)}input,select{width:100%;background:#fff}button{background:var(--ink);color:#fff;cursor:pointer;font-weight:750}.primary{background:var(--red)}.ghost{background:#f1ece4;color:var(--ink)}.types{display:flex;flex-wrap:wrap;gap:8px}.type{padding:9px 12px;border-radius:99px;background:#f1ece4;color:var(--muted);cursor:pointer;font-size:13px}.type.on{background:#28231e;color:#fff}.room{font-size:30px;letter-spacing:.2em;font-weight:850;color:var(--red)}.question{font-family:Georgia,serif;font-size:30px;line-height:1.2;margin:20px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#fff;text-align:left;color:var(--ink);min-height:88px;border:2px solid var(--line)}.choice:hover,.choice.selected{border-color:var(--red);background:#fff3ef}.choice b{color:var(--red);margin-right:8px}.progress{height:8px;background:#eee5d9;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--gold);transition:.3s}.score{font-size:68px;font-weight:900;color:var(--red)}.pill{display:inline-block;background:#f1ece4;padding:7px 11px;border-radius:99px;margin:4px}.hidden{display:none}.share{background:#fff3ef;padding:15px;border-radius:15px;line-height:1.6}@media(max-width:680px){.grid,.choices{grid-template-columns:1fr}main{padding:25px 15px}}
fieldset{margin:20px 0;border:1px solid #ddd;border-radius:12px;padding:15px}fieldset label{display:block;padding:10px}input[type=radio]{width:auto;margin-right:12px}button{margin:8px 0}button:disabled{opacity:.5}</style><main><div class="eyebrow">TWO OF A KIND · 二选一默契问答</div><h1>两种选择，<br><em>一次相遇。</em></h1><p>两位玩家分别完成同一套10道题。没有标准答案，只比较彼此的偏好。</p><section class="card" id="setup"><label for="name">你的昵称</label><input id="name" maxlength="20" placeholder="输入昵称"><button id="create" class="primary">创建双人房间</button><hr><label for="code">朋友的房间码</label><input id="code" maxlength="6"><button id="join">加入房间</button></section><section id="game" class="card hidden"><h2 id="room"></h2><p id="players"></p><button id="copy">复制邀请链接</button><p id="wait"></p><form id="form"></form><div id="result"></div><button id="leave" class="ghost">返回首页</button></section><p id="error" role="alert"></p><p class="muted">房间有效期24小时。服务重启后房间会清空，请重新创建。</p></main><script>const $=s=>document.querySelector(s);let session=null,rendered=false,busy=false;let params=new URLSearchParams(location.search);$('#code').value=params.get('room')||'';try{session=JSON.parse(sessionStorage.getItem('quiz-session'))}catch{};
function error(e){$('#error').textContent=e.message}async function api(path,data){let r=await fetch(path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json',...(session?{Authorization:session.token}:{})},...(data?{body:JSON.stringify(data)}:{})});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j;}
async function enter(action){if(busy)return;busy=true;try{const s=await api('/api/'+action,{name:$('#name').value,code:$('#code').value});session={token:s.token,code:s.code};sessionStorage.setItem('quiz-session',JSON.stringify(session));show(s)}catch(e){error(e)}finally{busy=false}}
$('#create').onclick=()=>enter('create');$('#join').onclick=()=>enter('join');$('#leave').onclick=()=>{sessionStorage.removeItem('quiz-session');location.href=location.pathname};$('#copy').onclick=async()=>{const link=location.origin+location.pathname+'?room='+session.code;try{await navigator.clipboard.writeText(link);$('#error').textContent='邀请链接已复制'}catch{$('#error').textContent=link}};
function show(s){$('#setup').classList.add('hidden');$('#game').classList.remove('hidden');$('#room').textContent='房间 '+s.code;$('#players').textContent=s.players.map(p=>p.name+(p.done?' · 已提交':' · 答题中')).join(' / ');$('#wait').textContent=s.players.length<2?'等待朋友加入后开始':s.submitted&&!s.result?'你已完成，等待对方提交。':'';if(s.players.length===2&&!rendered&&!s.submitted){rendered=true;const f=$('#form');s.questions.forEach((q,i)=>{let field=document.createElement('fieldset'),legend=document.createElement('legend');legend.textContent=(i+1)+'. '+q[1];field.append(legend);q.slice(2).forEach((opt,j)=>{let label=document.createElement('label'),input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;input.required=true;label.append(input,document.createTextNode(opt));field.append(label)});f.append(field)});let b=document.createElement('button');b.textContent='提交全部答案';b.className='primary';f.append(b);f.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const answers=s.questions.map((_,i)=>Number(new FormData(f).get('q'+i)));show(await api('/api/submit?code='+session.code,{answers}))}catch(e){error(e);b.disabled=false}};}$('#form').hidden=s.submitted||!!s.result;if(s.result){const score=s.result.score,level=score>=9?'心有灵犀':score>=7?'默契拍档':score>=5?'同频伙伴':score>=3?'探索搭档':'新鲜搭档';$('#result').replaceChildren();let title=document.createElement('h2');title.textContent=score+'/10 · '+score*10+'% · '+level;$('#result').append(title);let p=document.createElement('p');p.textContent='结果只代表本次选择。不同答案可以成为认识彼此的新话题。';$('#result').append(p);s.questions.forEach((q,i)=>{let p=document.createElement('p');p.textContent=q[1]+' '+s.players.map((p,j)=>p.name+'：'+q[2+s.result.answers[j][i]]).join(' / ');$('#result').append(p)})}}
async function refresh(){if(!session)return;try{show(await api('/api/state?code='+session.code));$('#error').textContent=''}catch(e){error(e)}}refresh();setInterval(refresh,2000);</script></html>
