<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二选一默契问答</title><style>
:root{--bg:#f7f3ec;--ink:#28231e;--muted:#7e766c;--card:#fffdf9;--line:#e8dfd3;--red:#e7664d;--gold:#e4a92f;--green:#387861}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}main{max-width:880px;margin:auto;padding:34px 18px 70px}.eyebrow{letter-spacing:.16em;font-size:12px;font-weight:800;color:var(--red)}h1{font-family:Georgia,serif;font-size:clamp(42px,8vw,76px);line-height:.95;letter-spacing:-.05em;margin:18px 0 12px}h1 em{font-style:normal;color:var(--red)}p{line-height:1.65}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:25px;padding:25px;margin-top:24px;box-shadow:0 15px 35px #5b493018}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:12px 0}.label{font-size:12px;letter-spacing:.1em;font-weight:800;color:var(--muted);display:block;margin-bottom:7px}input,select,button{font:inherit;border-radius:13px;padding:13px 14px;border:1px solid var(--line)}input,select{width:100%;background:#fff}button{background:var(--ink);color:#fff;cursor:pointer;font-weight:750}.primary{background:var(--red)}.ghost{background:#f1ece4;color:var(--ink)}.types{display:flex;flex-wrap:wrap;gap:8px}.type{padding:9px 12px;border-radius:99px;background:#f1ece4;color:var(--muted);cursor:pointer;font-size:13px}.type.on{background:#28231e;color:#fff}.room{font-size:30px;letter-spacing:.2em;font-weight:850;color:var(--red)}.question{font-family:Georgia,serif;font-size:30px;line-height:1.2;margin:20px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#fff;text-align:left;color:var(--ink);min-height:88px;border:2px solid var(--line)}.choice:hover,.choice.selected{border-color:var(--red);background:#fff3ef}.choice b{color:var(--red);margin-right:8px}.progress{height:8px;background:#eee5d9;border-radius:9px;overflow:hidden}.bar{height:100%;background:var(--gold);transition:.3s}.score{font-size:68px;font-weight:900;color:var(--red)}.pill{display:inline-block;background:#f1ece4;padding:7px 11px;border-radius:99px;margin:4px}.hidden{display:none}.share{background:#fff3ef;padding:15px;border-radius:15px;line-height:1.6}@media(max-width:680px){.grid,.choices{grid-template-columns:1fr}main{padding:25px 15px}}
fieldset{margin:20px 0;border:1px solid #ddd;border-radius:12px;padding:15px}fieldset label{display:block;padding:10px}input[type=radio]{width:auto;margin-right:12px}button{margin:8px 0}button:disabled{opacity:.5}[hidden]{display:none!important}#candidates label{display:block;padding:10px 0}input[type=checkbox],input[type=radio]{width:auto}textarea{width:100%;overflow-wrap:anywhere}button{margin:10px 5px 0 0}fieldset{margin:20px 0}fieldset label{display:block;padding:12px}</style></head><body><main><div class="eyebrow">TWO OF A KIND · 异步默契问答</div><h1>两种选择，<br><em>一次相遇。</em></h1><section id="setup" class="card"><p id="intro">选10道题并先作答，生成邀请链接。朋友可在任何时间回答，不需要同时在线。</p><label for="name">你的昵称</label><input id="name" maxlength="20" placeholder="输入昵称"><div id="candidates"></div><button id="start" class="primary">选好10题，开始作答</button></section><section id="quiz" class="card" hidden><h2 id="quizTitle"></h2><form id="answers"></form></section><section id="share" class="card" hidden><h2 id="shareTitle"></h2><label for="link">分享链接</label><textarea id="link" rows="5" readonly></textarea><button id="copy" class="primary">复制链接</button><p id="status" role="status"></p><p id="local">当前是本地文件预览。部署到静态网站后，生成的 HTTPS 链接才可在其他手机使用。</p><p>链接包含题目和答案，请只发给受邀朋友。页面会在答题后展示答案，但链接内容并非加密。</p><button data-home>重新创建一局</button></section><section id="result" class="card" hidden><div class="score" id="score"></div><h2 id="level"></h2><p id="summary"></p><button id="returnLink" class="primary">生成结果回传链接</button><div id="details"></div><button data-home>重新创建一局</button></section><section id="invalid" class="card" hidden><p id="invalidText"></p><button data-home>创建新游戏</button></section><p id="error" role="alert"></p><p class="muted">无需账号 · 无需房间服务器 · 题目及答案保存在链接中。朋友完成后需手动把结果链接发回给你。</p></main><script>const bank=[["日常习惯","周末更想怎么过？","宅家慢慢过","出门到处走"],["日常习惯","做事前更习惯？","先列清单","边做边调整"],["饮食偏好","点餐时更常选？","熟悉的招牌","没试过的新菜"],["饮食偏好","饮料更喜欢？","冰爽气泡","温柔热饮"],["旅行方式","旅行前更像？","计划好路线","到了再决定"],["旅行方式","住宿更在意？","位置方便","空间舒服"],["休闲娱乐","空闲晚上更想？","看一部电影","玩一会游戏"],["休闲娱乐","放松时更喜欢？","安静独处","热闹一起"],["社交能量","聚会结束后通常？","还想再聊聊","需要充充电"],["脑洞趣味","如果多出一天假期？","去一个新地方","在家享受慢时光"],["脑洞趣味","收到神秘礼物时？","马上拆开","留到合适时机"],["回忆怀旧","更容易让你怀念的是？","一首老歌","一件旧物"],["效率规划","面对截止日期更像？","提前完成","最后冲刺"],["价值观轻量","空闲时间更愿意？","学点新东西","好好休息"]];
const $=s=>document.querySelector(s);let invitation=null,chosen=[],name='',answers=[],guest=false;
function pack(x){let s='';for(const b of new TextEncoder().encode(JSON.stringify(x)))s+=String.fromCharCode(b);return btoa(s).replaceAll('+','-').replaceAll('/','_').replace(/=+$/,'')}
function unpack(s){if(s.length>40000)throw Error('链接过长');const raw=atob(s.replaceAll('-','+').replaceAll('_','/'));const x=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(raw,c=>c.charCodeAt(0))));if(x.v!==1||!['invite','result'].includes(x.kind)||typeof x.name!=='string'||!x.name.trim()||x.name.length>20||!Array.isArray(x.q)||x.q.length!==10||x.q.some(q=>!Array.isArray(q)||q.length!==4||q.some(t=>typeof t!=='string'||!t.trim()||t.length>100)||q[2]===q[3])||!validAnswers(x.a))throw Error('邀请链接内容无效');if(x.kind==='result'&&(typeof x.guest!=='string'||!x.guest.trim()||x.guest.length>20||!validAnswers(x.b)))throw Error('结果链接无效');return x;}
function validAnswers(a){return Array.isArray(a)&&a.length===10&&a.every(v=>v===0||v===1)}
function score(a,b){if(!validAnswers(a)||!validAnswers(b))throw Error('请完成全部题目');let n=a.filter((v,i)=>v===b[i]).length;return {n,percentage:n*10,level:n>=9?'心有灵犀':n>=7?'默契拍档':n>=5?'同频伙伴':n>=3?'探索搭档':'新鲜搭档'}}
function text(tag,value,parent){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e}
function screen(id){for(const el of document.querySelectorAll('section'))el.hidden=el.id!==id;$('#error').textContent=''}
function makeLink(x){return location.href.split('#')[0].split('?')[0]+'#'+pack(x)}
function share(x,message){screen('share');$('#shareTitle').textContent=message;$('#link').value=makeLink(x);$('#local').hidden=location.protocol!=='file:';$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#link').value);$('#status').textContent='链接已复制'}catch{$('#link').select();$('#status').textContent='请手动复制上方链接'}};}
function questions(){screen('quiz');$('#quizTitle').textContent=guest?'回答 '+invitation.name+' 的10道题':'先完成你的10道题';const form=$('#answers');form.replaceChildren();chosen.forEach((q,i)=>{const f=text('fieldset','',form);text('legend',(i+1)+'. '+q[1],f);q.slice(2).forEach((s,j)=>{const l=text('label','',f);const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;r.required=true;l.append(r,document.createTextNode(' '+(j?'B':'A')+' · '+s));})});const btn=text('button',guest?'提交并查看结果':'生成邀请链接',form);btn.className='primary';form.onsubmit=e=>{e.preventDefault();const d=new FormData(form);answers=chosen.map((_,i)=>Number(d.get('q'+i)));if(guest){const result={...invitation,kind:'result',guest:name,b:answers};results(result)}else share({v:1,kind:'invite',name,q:chosen,a:answers},'邀请朋友来答题');};}
function results(x){screen('result');const s=score(x.a,x.b);$('#score').textContent=s.n+'/10 · '+s.percentage+'%';$('#level').textContent=s.level;$('#summary').textContent=x.name+' 和 '+x.guest+' 的本次选择中，有 '+s.n+' 题相同。不同答案也是认识彼此的新话题。';const d=$('#details');d.replaceChildren();x.q.forEach((q,i)=>{text('h3',(i+1)+'. '+q[1],d);text('p',x.name+'：'+q[2+x.a[i]]+' / '+x.guest+'：'+q[2+x.b[i]]+(x.a[i]===x.b[i]?' · 一致':' · 不同'),d)});$('#returnLink').onclick=()=>share(x,'把结果链接发回给朋友');}
$('#start').onclick=()=>{name=$('#name').value.trim();if(!name){$('#error').textContent='请填写昵称';return}if(guest){chosen=invitation.q;questions();return}const checked=[...document.querySelectorAll('#candidates input:checked')];if(checked.length!==10){$('#error').textContent='请选择恰好10道题，当前已选'+checked.length+'道';return}chosen=checked.map(e=>bank[Number(e.value)]);questions();};
for(const b of document.querySelectorAll('[data-home]'))b.onclick=()=>{location.href=location.href.split('#')[0].split('?')[0];location.reload()};
try{if(location.hash.length>1){invitation=unpack(location.hash.slice(1));if(invitation.kind==='result')results(invitation);else{guest=true;$('#intro').textContent=invitation.name+' 邀请你回答10道二选一题。完成后才展示双方答案。';$('#candidates').hidden=true;$('#start').textContent='开始回答朋友的题目';}}else{bank.forEach((q,i)=>{let l=text('label','',$('#candidates'));let c=document.createElement('input');c.type='checkbox';c.value=i;c.checked=i<10;l.append(c,document.createTextNode(' '+q[1]+'（'+q[2]+' / '+q[3]+'）'));});}}catch(e){screen('invalid');$('#invalidText').textContent='链接已损坏或不兼容，请让朋友重新发送完整链接。';}
</script></body></html>
